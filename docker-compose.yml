version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: techrentalhub_es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false    # Tắt bảo mật để môi trường Dev dễ truy cập localhost
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # Giới hạn RAM chiếm dụng
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped

volumes:
  es_data:
    driver: local
