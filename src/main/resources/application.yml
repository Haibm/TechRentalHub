spring:
  application:
    name: TechRentalHub
  profiles:
    active: local

  datasource:
    url: jdbc:mysql://localhost:3306/techrentalhub_db?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        
  data:
    mongodb:
      uri: mongodb://localhost:27017/techrentalhub_mongo

  elasticsearch:
    uris: http://localhost:9200

jwt:
  expirationMs: 86400000 # 24 hours
